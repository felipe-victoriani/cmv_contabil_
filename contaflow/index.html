<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="ContaFlow — Sistema de gestão para CMV Contabilidade"
    />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2d6a4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ContaFlow" />
    <link rel="apple-touch-icon" href="images/logo_cmv.jpeg" />

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <title>CMV Contabilidade</title>

    <!-- Fontes (não-bloqueante: não trava render no mobile em conexões lentas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Phosphor Icons (carregamento não-bloqueante para não travar render no mobile) -->
    <link
      rel="preload"
      as="style"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <link
      rel="preload"
      as="style"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
      />
      <link
        rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"
      />
    </noscript>

    <!-- Loading state inline: visível antes de qualquer CSS externo carregar -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f2ed;
        z-index: 9999;
      }
      #app-loading__spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #e2ddd7;
        border-top-color: #2d6a4f;
        border-radius: 50%;
        animation: _ld-spin 0.75s linear infinite;
      }
      @keyframes _ld-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-loading__msg {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        font-family: sans-serif;
        color: #1a1814;
        padding: 0 24px;
      }
      #app-loading__msg p {
        font-size: 14px;
        color: #7a7570;
        max-width: 280px;
        line-height: 1.5;
      }
      #app-loading__retry {
        padding: 10px 24px;
        background: #2d6a4f;
        color: #fff;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }
    </style>

    <!-- Estilos globais -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/typography.css" />
    <link rel="stylesheet" href="styles/animations.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="components/modal/modal.css" />
    <link rel="stylesheet" href="components/toast/toast.css" />
  </head>
  <body>
    <div id="app">
      <div id="topbar-root"></div>
      <main id="page-root"></main>
    </div>

    <!-- Overlay de carregamento: removido pelo main.js após auth inicializar -->
    <div id="app-loading" role="status" aria-label="Carregando aplicação">
      <div id="app-loading__spinner"></div>
      <div id="app-loading__msg" role="alert">
        <p>
          Não foi possível conectar.<br />Verifique sua internet e tente
          novamente.
        </p>
        <button id="app-loading__retry" onclick="location.reload()">
          Tentar novamente
        </button>
      </div>
    </div>

    <script>
      // Timeout de segurança: se o app não carregar em 15s, exibe mensagem de erro
      var _loadTimeout = setTimeout(function () {
        var overlay = document.getElementById("app-loading");
        if (!overlay) return;
        var spinner = document.getElementById("app-loading__spinner");
        var msg = document.getElementById("app-loading__msg");
        if (spinner) spinner.style.display = "none";
        if (msg) msg.style.display = "flex";
      }, 15000);

      // Limpa o timeout quando o app carrega com sucesso
      window._clearLoadTimeout = function () {
        clearTimeout(_loadTimeout);
      };

      // Captura apenas erros reais de JavaScript (runtime/módulo).
      // IGNORA erros de carregamento de recursos (CSS, imagens, fontes, scripts externos)
      // pois eles também disparam 'error' na window e causariam falso positivo no mobile.
      window.addEventListener(
        "error",
        function (e) {
          // e.target !== window indica erro de recurso (img, link, script) — ignorar
          if (e.target && e.target !== window) return;
          var overlay = document.getElementById("app-loading");
          if (!overlay) return;
          clearTimeout(_loadTimeout);
          var spinner = document.getElementById("app-loading__spinner");
          var msg = document.getElementById("app-loading__msg");
          if (spinner) spinner.style.display = "none";
          if (msg) msg.style.display = "flex";
        },
        true,
      ); // capture=true para pegar erros de módulo também
    </script>

    <div id="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root"></div>

    <script type="module" src="main.js"></script>

    <!-- Registro do Service Worker (PWA) -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            /* sw não crítico em dev */
          });
        });
      }
    </script>
  </body>
</html>
